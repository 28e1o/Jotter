name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/jotter-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias jotter -storepass jotter2026 -keypass jotter2026 \
            -dname "CN=Open Apps Labs, OU=Mobile, O=Open Apps Labs, L=Jakarta, ST=Jakarta, C=ID"

      - name: Write local.properties for release signing
        run: |
          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/jotter-release.jks
          JOTTER_KEYSTORE_PASSWORD=jotter2026
          JOTTER_KEY_ALIAS=jotter
          JOTTER_KEY_PASSWORD=jotter2026
          EOF

      - name: Build release APK (R8 minified)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
